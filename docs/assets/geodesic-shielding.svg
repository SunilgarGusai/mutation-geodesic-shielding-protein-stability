<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Geodesic shielding concept</title>
  <desc id="desc">Side-by-side conceptual networks showing a shielded mutation and a mutation-containing route that can dominate.</desc>
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#effcf9"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#fff1f2"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#334155" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="460" rx="24" fill="#f8fafc"/>
  <text x="600" y="46" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#14364a">Two mutation-conditioned geodesic outcomes</text>

  <g filter="url(#s)">
    <rect x="45" y="82" width="520" height="325" rx="24" fill="url(#left)" stroke="#b9e5dc" stroke-width="2"/>
    <rect x="635" y="82" width="520" height="325" rx="24" fill="url(#right)" stroke="#fed7aa" stroke-width="2"/>
  </g>

  <text x="80" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f766e">SHIELDED</text>
  <text x="80" y="152" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#475569">γ ≥ 0 · bypass is no longer than the mutation route</text>

  <circle cx="120" cy="270" r="13" fill="#fff" stroke="#2563eb" stroke-width="3"/>
  <circle cx="485" cy="270" r="13" fill="#fff" stroke="#2563eb" stroke-width="3"/>
  <path d="M133 263 C235 160, 370 160, 472 263" fill="none" stroke="#14b8a6" stroke-width="10" stroke-linecap="round"/>
  <path d="M133 279 C240 355, 370 355, 472 279" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <circle cx="302" cy="330" r="18" fill="#fb923c" stroke="#c2410c" stroke-width="3"/>
  <text x="302" y="336" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#fff">m</text>
  <text x="302" y="195" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f766e">bypass geodesic</text>

  <text x="670" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#c2410c">GEODESICALLY SUSCEPTIBLE</text>
  <text x="670" y="152" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#475569">γ &lt; 0 · mutation-containing route can become shortest</text>

  <circle cx="710" cy="270" r="13" fill="#fff" stroke="#2563eb" stroke-width="3"/>
  <circle cx="1075" cy="270" r="13" fill="#fff" stroke="#2563eb" stroke-width="3"/>
  <path d="M723 263 C825 160, 960 160, 1062 263" fill="none" stroke="#14b8a6" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <path d="M723 279 C825 355, 960 355, 1062 279" fill="none" stroke="#fb923c" stroke-width="10" stroke-linecap="round"/>
  <circle cx="892" cy="330" r="18" fill="#fb923c" stroke="#c2410c" stroke-width="3"/>
  <text x="892" y="336" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#fff">m</text>
  <text x="892" y="384" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#c2410c">mutation-containing route</text>
</svg>