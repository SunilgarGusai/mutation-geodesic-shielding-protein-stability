<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Mutation Geodesic Shielding for Protein Stability</title>
  <desc id="desc">A scientific network banner showing a mutation node, bypass geodesic, mutation-containing route, and MGSC shielding concept.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b2f"/>
      <stop offset="0.55" stop-color="#103e5c"/>
      <stop offset="1" stop-color="#0d6b6f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1400" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="24" fill="url(#grid)"/>

  <g opacity=".26" stroke="#9dd9e8" stroke-width="2">
    <line x1="1015" y1="95" x2="1110" y2="155"/><line x1="1110" y1="155" x2="1235" y2="115"/>
    <line x1="1110" y1="155" x2="1180" y2="250"/><line x1="1180" y1="250" x2="1300" y2="300"/>
    <line x1="1015" y1="95" x2="965" y2="210"/><line x1="965" y1="210" x2="1045" y2="320"/>
    <line x1="1045" y1="320" x2="1180" y2="250"/><line x1="1235" y1="115" x2="1300" y2="300"/>
    <line x1="965" y1="210" x2="1180" y2="250"/>
  </g>

  <g fill="#b7d9e6" opacity=".9">
    <circle cx="1015" cy="95" r="10"/><circle cx="1110" cy="155" r="9"/><circle cx="1235" cy="115" r="10"/>
    <circle cx="965" cy="210" r="10"/><circle cx="1045" cy="320" r="10"/><circle cx="1180" cy="250" r="11"/>
    <circle cx="1300" cy="300" r="10"/>
  </g>

  <path d="M 965 210 C 1040 110, 1170 95, 1235 115" fill="none" stroke="#5eead4" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 965 210 C 1040 255, 1090 255, 1180 250 C 1225 250, 1265 270, 1300 300" fill="none" stroke="#fb923c" stroke-width="7" stroke-linecap="round" opacity=".95"/>

  <g transform="translate(1138 202)">
    <path d="M42 0 L82 15 V50 C82 78 64 99 42 110 C20 99 2 78 2 50 V15 Z" fill="#0b2238" stroke="url(#shield)" stroke-width="4"/>
    <path d="M23 54 L37 68 L63 39" fill="none" stroke="#5eead4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="18" r="10" fill="#fb923c"/>
    <text x="42" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#071b2f">m</text>
  </g>

  <text x="88" y="98" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#7dd3fc" letter-spacing="3">MGSC</text>
  <text x="88" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="47" font-weight="800" fill="#ffffff">Mutation Geodesic Shielding</text>
  <text x="88" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" fill="#d8f3f5">for Protein Stability</text>
  <text x="88" y="266" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#c9e4ec">Interpretable mutation-conditioned residue-network susceptibility</text>

  <g transform="translate(88 305)">
    <rect x="0" y="0" width="235" height="52" rx="26" fill="#123f5f" stroke="#5eead4" stroke-opacity=".65"/>
    <circle cx="30" cy="26" r="7" fill="#5eead4"/>
    <text x="49" y="33" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#e8fbff">Bypass geodesic</text>
    <rect x="252" y="0" width="285" height="52" rx="26" fill="#123f5f" stroke="#fb923c" stroke-opacity=".65"/>
    <circle cx="282" cy="26" r="7" fill="#fb923c"/>
    <text x="302" y="33" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#fff4e7">Mutation-containing route</text>
    <rect x="554" y="0" width="225" height="52" rx="26" fill="#123f5f" stroke="#7dd3fc" stroke-opacity=".55"/>
    <text x="666" y="33" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#e8fbff">γ = q − b</text>
  </g>
</svg>